# This file is centrally managed as a template file in https://github.com/canonical/solutions-engineering-automation
# To update the file:
# - Edit it in the canonical/solutions-engineering-automation repository.
# - Open a PR with the changes.
# - When the PR merges, the soleng-terraform bot will open a PR to the target repositories with the changes.
name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.rst"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Complete git history is required to generate the version from git tags.

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y yamllint
          python -m pip install --upgrade pip
          # pin tox to the current major version to avoid
          # workflows breaking all at once when a new major version is released.
          python -m pip install 'tox<5'

      - name: Run linters
        run: tox -e lint

      - name: Lint yaml files
        run: |
          yamllint .yamllint snap/snapcraft.yaml

  unit:
    name: Unit
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'tox<5'

    - name: Run unit tests
      run: tox -e unit

    - name: Determine system architecture
      run: echo "SYSTEM_ARCH=$(uname -m)" >> $GITHUB_ENV

    - name: Create artifact name suffix
      run: |
        PYTHON_VERSION_SANITIZED=${{ matrix.python-version }}
        PYTHON_VERSION_SANITIZED=${PYTHON_VERSION_SANITIZED//./-}
        echo "ARTIFACT_SUFFIX=$PYTHON_VERSION_SANITIZED-${{ env.SYSTEM_ARCH }}" >> $GITHUB_ENV

    - name: Rename Unit Test Coverage Artifact
      run: |
        if [ -e ".coverage-unit" ]; then
          mv .coverage-unit .coverage-unit-${{ env.ARTIFACT_SUFFIX }}
        else
          echo "No coverage file found, skipping rename"
        fi

    - name: Upload Unit Test Coverage File
      uses: actions/upload-artifact@v7
      with:
        include-hidden-files: true
        if-no-files-found: ignore
        name: coverage-unit-${{ env.ARTIFACT_SUFFIX }}
        path: .coverage-unit-${{ env.ARTIFACT_SUFFIX }}

  build:
    needs:
      - lint
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [[ubuntu-24.04]]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Complete git history is required to generate the version from git tags.

      - name: Verify snap builds successfully
        id: build
        uses: canonical/action-build@v1

      - name: Determine system architecture
        run: echo "SYSTEM_ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Upload the built snap
        uses: actions/upload-artifact@v7
        with:
          name: snap_${{ env.SYSTEM_ARCH }}
          path: ${{ steps.build.outputs.snap }}

  func:
    needs:
      - build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [[self-hosted-linux-amd64-jammy-xlarge]]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Complete git history is required to generate the version from git tags.

      - name: Determine system architecture
        run: echo "SYSTEM_ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Download snap file artifact
        uses: actions/download-artifact@v8
        with:
          name: snap_${{ env.SYSTEM_ARCH }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v6	
        with:
          python-version: "3.10"

      - name: Setup Juju 3.6/stable environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          juju-channel: 3.6/stable

      - name: Deploy MinIO for MySQL backups
        run: |
          set -euo pipefail

          K8S_HOST_MODEL=juju-backup-all-k8s-host-model
          K8S_CLOUD=juju-backup-all-k8s-cloud
          MINIO_MODEL=juju-backup-all-minio-model
          MINIO_BUCKET=mysql-backups
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin123
          CONTROLLER_NAME=$(juju controllers --format=json | python3 -c \
            'import json, sys; print(json.load(sys.stdin)["current-controller"])')

          juju add-model "$K8S_HOST_MODEL" localhost
          juju deploy k8s -m "$K8S_HOST_MODEL" \
            --channel=1.32/stable \
            --base=ubuntu@24.04 \
            --constraints='cores=2 mem=16G root-disk=40G virt-type=virtual-machine'
          juju wait-for application -m "$K8S_HOST_MODEL" k8s \
            --query='name=="k8s" && (status=="active" || status=="idle")' --timeout=40m

          juju ssh -m "$K8S_HOST_MODEL" k8s/0 -- sudo k8s config \
            | juju add-k8s "$K8S_CLOUD" --controller "$CONTROLLER_NAME"
          juju add-model "$MINIO_MODEL" "$K8S_CLOUD"
          juju deploy minio -m "$MINIO_MODEL" \
            --channel=ckf-1.10/stable \
            --trust \
            --config="access-key=$MINIO_ACCESS_KEY" \
            --config="secret-key=$MINIO_SECRET_KEY"
          juju wait-for application -m "$MINIO_MODEL" minio \
            --query='name=="minio" && (status=="active" || status=="idle")' --timeout=20m

          MINIO_SERVICE_MANIFEST=$(printf '%s\n' \
            'apiVersion: v1' \
            'kind: Service' \
            'metadata:' \
            '  name: minio-external' \
            "  namespace: $MINIO_MODEL" \
            'spec:' \
            '  type: NodePort' \
            '  selector:' \
            '    app.kubernetes.io/name: minio' \
            '  ports:' \
            '    - name: s3' \
            '      protocol: TCP' \
            '      port: 9000' \
            '      targetPort: 9000')
          juju ssh -m "$K8S_HOST_MODEL" k8s/0 -- sudo k8s kubectl apply -f - <<< "$MINIO_SERVICE_MANIFEST"

          NODE_IP=$(juju ssh -m "$K8S_HOST_MODEL" k8s/0 -- \
            "sudo k8s kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type==\"InternalIP\")].address}'")
          S3_PORT=$(juju ssh -m "$K8S_HOST_MODEL" k8s/0 -- \
            "sudo k8s kubectl -n $MINIO_MODEL get service minio-external -o jsonpath='{.spec.ports[?(@.name==\"s3\")].nodePort}'")

          {
            echo "S3_INTEGRATOR_ENDPOINT=http://$NODE_IP:$S3_PORT"
            echo "S3_INTEGRATOR_BUCKET=$MINIO_BUCKET"
            echo "S3_INTEGRATOR_PATH=/$MINIO_MODEL/mysql"
            echo "S3_INTEGRATOR_ACCESS_KEY=$MINIO_ACCESS_KEY"
            echo "S3_INTEGRATOR_SECRET_KEY=$MINIO_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'tox<5'

      - name: Run func tests
        run: |
          export TEST_SNAP="$(pwd)/$(ls | grep '.*_.*\.snap$')"
          echo "$TEST_SNAP"
          tox -e func -- --cloud localhost

      - name: Create artifact name suffix
        run: |
          BASE_VERSION_SANITIZED=${{ matrix.runs-on }}
          BASE_VERSION_SANITIZED=${BASE_VERSION_SANITIZED//./-}
          echo "ARTIFACT_SUFFIX=$BASE_VERSION_SANITIZED-${{ env.SYSTEM_ARCH }}" >> $GITHUB_ENV

      - name: Rename Functional Test Coverage Artifact
        run: |
          if [ -e ".coverage-func" ]; then
            mv .coverage-func .coverage-func-${{ env.ARTIFACT_SUFFIX }}
          else
            echo "No coverage file found, skipping rename"
          fi

      - name: Upload Functional Test Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          if-no-files-found: ignore
          name: coverage-functional-${{ env.ARTIFACT_SUFFIX }}
          path: .coverage-func-${{ env.ARTIFACT_SUFFIX }}

  tics-analysis:
    runs-on: [self-hosted, linux, amd64, tiobe, jammy]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: func
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Install everything from all requirements.txt files otherwise TICS errors.
      - name: Install all snap dependencies
        env:
          # to ensure that zaza installs correctly
          TEST_JUJU3: "1"
        run: |
          # run in a virtualenv to ensure dependencies will not conflict with the system python packages
          sudo apt update
          sudo apt install python3-venv -y
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install coverage[toml] pylint flake8

          for f in $(find -name '*requirements.txt'); do
              echo "${f}"
              .venv/bin/python -m pip install --requirement "${f}"
          done

          # Symlink venv to a short path so TICS version string stays under 31 chars
          sudo ln -s "$GITHUB_WORKSPACE/.venv" /opt/venv
          echo "/opt/venv/bin" >> $GITHUB_PATH

      - name: Determine system architecture
        run: echo "SYSTEM_ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Download Coverage Files
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*-${{ env.SYSTEM_ARCH }}
          merge-multiple: true
          path: artifacts/
        continue-on-error: true

      - name: Merge coverage reports
        run: |
          # Create the path that is expected to have a coverage.xml for tics
          mkdir -p tests/report/

          coverage_files=(./artifacts/.coverage*)

          if [ -e "${coverage_files[0]}" ]; then
            echo "Merging coverage files: ${coverage_files[*]}"
            coverage combine "${coverage_files[@]}"

            # Check if there is actual data to report before generating XML with merged reports
            if coverage report > /dev/null 2>&1; then
              coverage report --show-missing
              coverage xml -o tests/report/coverage.xml
            fi

          fi

      - name: Run TICS analysis
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: juju-backup-all
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          branchdir: ${{ github.workspace }}
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
